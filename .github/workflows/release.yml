name: Inkora release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Android signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.INKORA_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "INKORA_KEYSTORE_BASE64 is not configured. Add the stable Android signing key before publishing."
          }
          $path = Join-Path $env:RUNNER_TEMP "inkora-release.jks"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "INKORA_KEYSTORE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows and Android packages
        shell: pwsh
        env:
          INKORA_KEYSTORE_PASSWORD: ${{ secrets.INKORA_KEYSTORE_PASSWORD }}
          INKORA_KEY_ALIAS: ${{ secrets.INKORA_KEY_ALIAS }}
          INKORA_KEY_PASSWORD: ${{ secrets.INKORA_KEY_PASSWORD }}
        run: |
          # Compose's packaging tasks and the PDFBox resource task use Gradle
          # project objects at execution time, so disable configuration-cache
          # for this release build even though local builds may cache safely.
          .\gradlew.bat :composeApp:packageMsi :composeApp:createDistributable :composeApp:assembleRelease --no-daemon --no-configuration-cache

      - name: Stage release assets and manifest
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $release = Join-Path $pwd "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          $portableSource = "composeApp/build/compose/binaries/main/app/Inkora"
          $portable = Join-Path $release "Inkora-$version-windows-portable.zip"
          if (-not $msi -or -not (Test-Path $portableSource)) { throw "Windows outputs are missing." }
          Copy-Item $msi.FullName (Join-Path $release "Inkora-$version.msi")
          Compress-Archive -Path (Join-Path $portableSource '*') -DestinationPath $portable -Force
          $apkSource = "composeApp/build/outputs/apk/release/composeApp-release.apk"
          if (-not (Test-Path $apkSource)) { throw "Release APK is missing." }
          Copy-Item $apkSource (Join-Path $release "Inkora-$version-android.apk")

          function Sha256([string] $path) { (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() }
          $msiPath = Join-Path $release "Inkora-$version.msi"
          $apkPath = Join-Path $release "Inkora-$version-android.apk"
          $base = "https://github.com/$($env:REPOSITORY)/releases/download/$($env:TAG)"
          $metadata = Get-Content "composeApp/build/outputs/apk/release/output-metadata.json" | ConvertFrom-Json
          $versionCode = [int]$metadata.elements[0].versionCode
          $manifest = [ordered]@{
            version = $version
            versionCode = $versionCode
            notes = "See the release notes for changes in Inkora $version."
            releaseUrl = "https://github.com/$($env:REPOSITORY)/releases/tag/$($env:TAG)"
            playStoreUrl = "https://play.google.com/store/apps/details?id=com.inkora"
            windowsPortable = [ordered]@{ url = "$base/Inkora-$version-windows-portable.zip"; sha256 = (Sha256 $portable) ; sizeBytes = (Get-Item $portable).Length }
            windowsMsi = [ordered]@{ url = "$base/Inkora-$version.msi"; sha256 = (Sha256 $msiPath) ; sizeBytes = (Get-Item $msiPath).Length }
            androidApk = [ordered]@{ url = "$base/Inkora-$version-android.apk"; sha256 = (Sha256 $apkPath) ; sizeBytes = (Get-Item $apkPath).Length }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $release "latest.json") -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
